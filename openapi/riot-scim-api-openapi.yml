      responses:
        '204':
          content:
            application/scim+json:
              schema:
                type: object
          description: User deleted
        '404':
          content:
            application/scim+json:
              schema:
                type: object
          description: User not found
        '500':
          content:
            application/scim+json:
              schema:
                type: object
          description: Failed to delete user
      security:
      - apiKeyAuth:
        - scim:write
      summary: Delete a SCIM user
      tags:
      - SCIM
      x-riot-team-ownership: platform
    get:
      description: 'Gets a single user by ID.


        **Scopes required:**

        - scim:read'
      operationId: users_get_user_3IQ5M4I
      parameters:
      - in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: user_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                type: object
          description: SCIM user
        '404':
          content:
            application/scim+json:
              schema:
                type: object
          description: User not found
      security:
      - apiKeyAuth:
        - scim:read
      summary: Get a SCIM user
      tags:
      - SCIM
      x-riot-team-ownership: platform
    patch:
      description: 'Partially updates an existing user using SCIM PATCH operations (RFC 7644 Section 3.5.2).


        **Scopes required:**

        - scim:write'
      operationId: users_patch_user_3IQ5M4I
      parameters:
      - in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: user_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/scim+json:
