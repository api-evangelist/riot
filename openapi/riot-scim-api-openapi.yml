      x-riot-team-ownership: platform
    put:
      description: 'Updates an existing user (SCIM PUT).


        **Scopes required:**

        - scim:write'
      operationId: users_update_user_3IQ5M4I
      parameters:
      - in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: user_id
        required: true
        schema:
          format: uuid
