components:
  responses:
    EndpointNotFoundErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/EndpointNotFoundErrorResponse'
      description: Requested endpoint is not found
    ForbiddenErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenErrorResponse'
      description: Requested resource cannot be accessed
    RateLimitExceededErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RateLimitExceededErrorResponse'
      description: Rate limit is exceeded
    UnauthorizedErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedErrorResponse'
      description: Missing API key or the key is invalid
    UnprocessableContentErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnprocessableContentErrorResponse'
      description: Unprocessable content
  schemas:
    AttackEventTypeSchema:
      enum:
      - attachment_opened
      - attack_sent
      - attack_voided
      - credentials_submitted
      - download_link_clicked
      - email_answered
      - email_opened
      - email_reported
      - employee_tricked
      - file_opened
      - manually_reported
      - manually_retried
      - mfa_code_submitted
      - page_opened
      - phishing_remedial_course_completed
      - phone_number_called
      - phone_number_code_entered
      - qr_code_scanned
      - remedial_completed
      - remedial_started
      - scope_granted
      - sms_answered
      - social_login_clicked
      title: AttackEventTypeSchema
      type: string
    OrganizationWorkspaceSchema:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        cyber_posture:
          anyOf:
          - type: 'null'
          - $ref: '#/components/schemas/CyberPostureSchema'
          description: Latest cyber posture summary for the workspace.
        id:
          format: uuid
          type: string
        name:
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - cyber_posture
      - updated_at
      - created_at
      - name
      - id
      title: OrganizationWorkspaceSchema
      type: object
    EmployeeMissionStatsSchema:
      additionalProperties: false
      properties:
        streak_count:
          description: Current consecutive completed-missions streak
          type: integer
      required:
      - streak_count
      title: EmployeeMissionStatsSchema
      type: object
    CourseOverviewSchema:
      additionalProperties: false
      properties:
        description:
          description: Description of the course, provided in the workspace's default locale.
          examples:
          - Learn how to manage your digital presence effectively
          type: string
        id:
          format: uuid
          type: string
        name:
          description: Name of the course, provided in the workspace's default locale.
          examples:
          - Digital Footprint
          type: string
        slug:
          description: Slug of the course
          examples:
          - digital_footprint
          type: string
      required:
      - description
      - name
      - slug
      - id
      title: CourseOverviewSchema
      type: object
    DetectionType:
      description: Detection type derived from the verdict.
      enum:
      - Phishing
      - Safe
      - Spam
      examples:
      - Phishing
      title: DetectionType
      type: string
    PaginatedGroupPayload:
      additionalProperties: false
      properties:
        created_at:
          description: Group creation date
          format: date-time
          type: string
        description:
          description: Description of the group
          type:
          - string
          - 'null'
        id:
          description: UUID of the group
          format: uuid
          type: string
        name:
          description: Name of the group
          examples:
          - Marketing Team
          type: string
      required:
      - created_at
      - name
      - id
      title: PaginatedGroupPayload
      type: object
    ObservableType:
      description: OCSF observable type name.
      enum:
      - Email Address
      - File
      examples:
      - Email Address
      title: ObservableType
      type: string
    WorkspaceNotFoundErrorResponse:
      additionalProperties: false
      properties:
        errors:
          items:
            additionalProperties: false
            properties:
              code:
                const: workspace_not_found
              detail:
                type: string
              source:
                properties:
                  pointer:
                    type: string
                required:
                - pointer
                type: object
              title:
                const: Workspace not found
            required:
            - title
            - source
            - detail
            type: object
          type: array
      required:
      - errors
      title: WorkspaceNotFoundErrorResponse
      type: object
    CourseProgressSchema:
      additionalProperties: false
      properties:
        course:
          $ref: '#/components/schemas/CourseOverviewSchema'
        quiz_score:
          description: Score obtained on the in-course quiz, formatted as `"correct/total"`. For program courses, this reflects
            the current program year; for manually assigned courses, this reflects the latest assignment. `null` if not completed
            yet or no quiz.
          examples:
          - 4/5
          type:
          - string
          - 'null'
        status:
          anyOf:
          - type: 'null'
          - $ref: '#/components/schemas/EmployeeCourseStatusSchema'
          description: The current status of the employee for this course. For program courses, this reflects the current
            program year; for manually assigned courses, this reflects the latest assignment.
        years:
          description: The history of employee's course statuses until current program year. Empty for manually assigned courses,
            which are not tied to a program year.
          items:
            $ref: '#/components/schemas/EmployeeCourseStatusPerYearSchema'
          type: array
      required:
      - years
      - quiz_score
      - status
      - course
      title: CourseProgressSchema
      type: object
    PaginatedCoursePayload:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        description:
          description: Description of the course, provided in the workspace's default locale.
          examples:
          - Learn how to manage your digital presence effectively
          type: string
        duration:
          description: Average duration in minutes
          type: integer
        id:
          format: uuid
          type: string
        name:
          description: Name of the course, provided in the workspace's default locale.
          examples:
          - Digital Footprint
          type: string
        settings:
          items:
            $ref: '#/components/schemas/WorkspaceCourseSettingsSchema'
          type: array
        slug:
          description: Slug of the course
          examples:
          - digital_footprint
          type: string
        theme:
          $ref: '#/components/schemas/CourseTheme'
        updated_at:
          format: date-time
          type: string
      required:
      - settings
      - theme
      - duration
      - description
      - name
      - slug
      - updated_at
      - created_at
      - id
      title: PaginatedCoursePayload
      type: object
    RevokeDriveItemPermissionRequestCreatedProviderData:
      additionalProperties: false
      properties:
        drive_item_id:
          description: Provider-side identifier of the drive item the permission grants access to.
          examples:
          - 0BxYzAbCdEfGhIjKlMnOp
          type: string
        owner_id:
          description: Provider-side identifier of the drive item owner.
          examples:
          - owner@example.com
          type: string
        permission_id:
          description: Provider-side identifier of the permission to revoke.
          examples:
          - anyoneWithLink
          type: string
        shared_drive_id:
          description: Provider-side identifier of the shared drive, when the item lives in one (Microsoft only).
          examples:
          - b!abc123
          type: string
      required:
      - drive_item_id
      - permission_id
      - owner_id
      title: RevokeDriveItemPermissionRequestCreatedProviderData
      type: object
    InboxEmailAnalysisClassifiedActor:
      additionalProperties: false
      properties:
        user:
          $ref: '#/components/schemas/InboxEmailAnalysisClassifiedUser'
      required:
      - user
      title: InboxEmailAnalysisClassifiedActor
      type: object
    ReportAttackFromMessageIdRequest:
      additionalProperties: false
      properties:
        message_id:
          description: The RFC 5322 Message-ID header of the reported email.
          examples:
          - <8e3b1a2c-0f1d-4e9b-9c1e-1234567890ab@noreply.link>
          type: string
      required:
      - message_id
      title: ReportAttackFromMessageIdRequest
      type: object
    Provider:
      description: Cloud provider the permission belongs to.
      enum:
      - google
      - microsoft
      examples:
      - google
      title: Provider
      type: string
    CyberPostureGrade:
      enum:
      - a
      - b
      - c
      - d
      title: CyberPostureGrade
      type: string
    ForbiddenErrorResponse:
      additionalProperties: false
      properties:
        errors:
          items:
            additionalProperties: false
            properties:
              code:
                const: forbidden
              detail:
                type: string
              source:
                properties:
                  pointer:
                    type: string
                required:
                - pointer
                type: object
              title:
                const: Forbidden
            required:
            - title
            - source
            - detail
            type: object
          type: array
      required:
      - errors
      title: ForbiddenErrorResponse
      type: object
    ObservableTypeId:
      description: OCSF observable type id. `5` for `Email Address`, `7` for `File`.
      enum:
      - 5
      - 7
      examples:
      - 5
      title: ObservableTypeId
      type: integer
    AttackEventSchema:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        data:
          anyOf:
          - type: 'null'
          - $ref: '#/components/schemas/AttackEventDataSchema'
          description: Available only for `credentials_submitted' event type.
        id:
          format: uuid
          type: string
        type:
          $ref: '#/components/schemas/AttackEventTypeSchema'
      required:
      - data
      - type
      - created_at
      - id
      title: AttackEventSchema
      type: object
    AttackServiceSchema:
      additionalProperties: false
      properties:
        name:
          description: Name of the service being used in the phishing attack. Returns 'This service is no longer available'
            for services that have been deprecated.
          examples:
          - Microsoft
          type: string
      required:
      - name
      title: AttackServiceSchema
      type: object
    InboxEmailAnalysisClassifiedEvent:
      additionalProperties: false
      properties:
        data:
          $ref: '#/components/schemas/InboxEmailAnalysisClassifiedData'
        timestamp:
          description: ISO 8601 timestamp at which the event was created in Riot. This is the event time, not the delivery
            attempt time. The delivery time is sent in the `webhook-timestamp` header.
          format: date-time
          type: string
        type:
          const: inbox_email_analysis.classified
      required:
      - data
      - timestamp
      - type
      title: InboxEmailAnalysisClassifiedEvent
      type: object
    PaginatedDomainPayload:
      additionalProperties: false
      properties:
        id:
          description: UUID of the domain
          format: uuid
          type: string
        name:
          description: Domain name
          examples:
          - acme.com
          type: string
        simulation_spoofed_domains:
          description: Alphabetically sorted sender domains that simulation may spoof when sending phishing or smishing attacks.
          examples:
          - - micr0osoft.com
            - noreply.link
            - slack-notifications.com
          items:
            type: string
          type: array
        status:
          $ref: '#/components/schemas/DomainStatus'
      required:
      - simulation_spoofed_domains
      - status
      - name
      - id
      title: PaginatedDomainPayload
      type: object
    PaginatedEmployeeWithReportsPayload:
      additionalProperties: false
      properties:
        emails_reported_stats:
          $ref: '#/components/schemas/EmailsReportedStatsSchema'
        employee:
          $ref: '#/components/schemas/EmployeeOverviewSchema'
      required:
      - emails_reported_stats
      - employee
      title: PaginatedEmployeeWithReportsPayload
      type: object
    ParrotWeb.PublicApi.Scim.Schemas.UserSchema:
      properties:
        active:
          description: Whether the user is active. Defaults to true if not provided
          type: boolean
        department:
          description: Department of the user
          type: string
        emails:
          items:
            properties:
              primary:
                anyOf:
                - type: boolean
                - type: string
                description: Whether this is the primary email (boolean or string)
              type:
                description: A label indicating the type of email address. The only currently supported value is 'work'.
                enum:
                - work
                type: string
              value:
                description: Email address
                format: email
                type: string
            required:
            - value
            - primary
            type: object
          minItems: 1
          type: array
        externalId:
          type: string
        manager:
          properties:
            $ref:
              description: The URI of the 'User' resource corresponding to the manager
              type: string
            displayName:
              description: Family name of the user
              type: string
            value:
              description: The identifier of the manager's User
              type: string
          required:
          - value
          type: object
        name:
          properties:
            familyName:
              description: Family name of the user
              type: string
            givenName:
              description: Given name of the user
              type: string
          required:
          - givenName
          - familyName
          type: object
        preferredLanguage:
          description: User's preferred language in ISO 639-1 language code with ISO 3166-1 country code format (e.g., 'en-US',
            'fr-FR').
          type: string
        timezone:
          description: User's timezone in Olson format (e.g., 'America/Los_Angeles'). Defaults to workspace timezone if not
            provided.
          type: string
        userName:
          description: Unique identifier for the user
          type: string
      required:
      - userName
      - name
      - emails
      type: object
    ReportsStatistics:
      additionalProperties: false
      properties:
        employee_reporting_rate:
          description: Rate of employee participation in reporting as a percentage (0.0 to 100.0)
          examples:
          - 17.0
          type: number
        reporters_count:
          description: Number of unique employees who submitted at least one report
          type: integer
        total_count:
          description: Total number of reports submitted by employees
          type: integer
      required:
      - employee_reporting_rate
      - reporters_count
      - total_count
      title: ReportsStatistics
      type: object
    EmployeeCourseStatusPerYearSchema:
      additionalProperties: false
      properties:
        completed_at:
          format: date-time
          type:
          - string
          - 'null'
        due_at:
          format: date-time
          type: string
        quiz_score:
          description: Score obtained on the in-course quiz for that year, formatted as `"correct/total"`. `null` if the course
            has not been completed yet or has no quiz.
          examples:
          - 4/5
          type:
          - string
          - 'null'
        status:
          $ref: '#/components/schemas/EmployeeCourseStatusSchema'
        year:
          description: The year of the course in the program
          type: integer
      required:
      - quiz_score
      - completed_at
      - due_at
      - year
      - status
      title: EmployeeCourseStatusPerYearSchema
      type: object
    PaginatedGroupEmployeePayload:
      additionalProperties: false
      properties:
        id:
          description: UUID of the employee
          format: uuid
          type: string
        name:
          description: Full name of the employee
          type: string
        primary_email_address:
          description: Primary email address of the employee
          format: email
          type: string
        username:
          description: Username of the employee
          examples:
          - john.doe
          type:
          - string
          - 'null'
      required:
      - username
      - primary_email_address
      - name
      - id
      title: PaginatedGroupEmployeePayload
      type: object
    InboxEmailAnalysisClassifiedUnmappedRiot:
      additionalProperties: false
      properties:
        analysis_status:
          $ref: '#/components/schemas/AnalysisStatus'
        classification_bucket:
          description: Name of the bucket that matched, when classification went through bucketing.
          examples:
          - credential_harvesting
          type: string
        explanations:
          description: Signals that contributed to the verdict. Scenarios are excluded.
          items:
            $ref: '#/components/schemas/InboxEmailAnalysisClassifiedExplanation'
          type: array
        report_source:
          $ref: '#/components/schemas/ReportSource'
        reported_at:
          description: ISO 8601 timestamp at which the email was reported.
          format: date-time
          type: string
        workspace_id:
          description: Workspace the analysis belongs to.
          format: uuid
          type: string
      required:
      - reported_at
      - report_source
      - analysis_status
      - workspace_id
      title: InboxEmailAnalysisClassifiedUnmappedRiot
      type: object
    InboxEmailAnalysisClassifiedEvidence:
      additionalProperties: false
      properties:
        email:
          $ref: '#/components/schemas/InboxEmailAnalysisClassifiedEmail'
      required:
      - email
      title: InboxEmailAnalysisClassifiedEvidence
      type: object
    EmployeeSecurityLevel:
      enum:
      - bad
      - dangerous
      - excellent
      - exceptional
      - good
      - great
      - ok
      title: EmployeeSecurityLevel
      type: string
    EmployeeCourseStatusSchema:
      enum:
      - completed
      - missed
      - upcoming
      title: EmployeeCourseStatusSchema
      type: string
    WorkspaceOverviewSchema:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
      required:
      - id
      title: WorkspaceOverviewSchema
      type: object
    EmployeeEmailAddressSchema:
      additionalProperties: false
      properties:
        address:
          description: Email address
          examples:
          - john.doe@tryriot.com
          format: email
          type: string
        is_primary:
          type: boolean
        source:
          $ref: '#/components/schemas/EmployeeEmailAddressSource'
      required:
      - is_primary
      - source
      - address
      title: EmployeeEmailAddressSchema
      type: object
    UnprocessableContentErrorResponse:
      additionalProperties: false
      properties:
        errors:
          items:
            additionalProperties: false
            properties:
              code:
                type: string
              detail:
                type: string
              source:
                properties:
                  pointer:
                    type: string
                required:
                - pointer
                type: object
              title:
                type: string
            required:
            - title
            - source
            - detail
            type: object
          type: array
      required:
      - errors
      title: UnprocessableContentErrorResponse
      type: object
    InboxEmailAnalysisClassifiedFindingInfo:
      additionalProperties: false
      properties:
        analytic:
          $ref: '#/components/schemas/InboxEmailAnalysisClassifiedAnalytic'
        src_url:
          description: Link to the inbox ticket in the Riot Hub.
          examples:
          - https://hub.tryriot.com/inbox/01HW...
          type: string
        types:
          items:
            $ref: '#/components/schemas/DetectionType'
          type: array
        uid:
          description: Unique identifier of the analysis.
          format: uuid
          type: string
      required:
      - src_url
      - types
      - analytic
      - uid
      title: InboxEmailAnalysisClassifiedFindingInfo
      type: object
    EmployeeNotFoundErrorResponse:
      additionalProperties: false
      properties:
        error:
          const: Employee not found
      required:
      - error
      title: EmployeeNotFoundErrorResponse
      type: object
    EmployeeEventsSchema:
      additionalProperties: false
      properties:
        attachment_opened:
          description: Number of attachment_opened events
          type: integer
        attack_sent:
          description: Number of attack_sent events
          type: integer
        attack_voided:
          description: Number of attack_voided events
          type: integer
        credentials_submitted:
          description: Number of credentials_submitted events
          type: integer
        download_link_clicked:
          description: Number of download_link_clicked events
          type: integer
        email_answered:
          description: Number of email_answered events
          type: integer
        email_opened:
          description: Number of email_opened events
          type: integer
        email_reported:
          description: Number of email_reported events
          type: integer
        employee_tricked:
          description: Number of employee_tricked events
          type: integer
        file_opened:
          description: Number of file_opened events
          type: integer
        manually_reported:
          description: Number of manually_reported events
          type: integer
        manually_retried:
          description: Number of manually_retried events
          type: integer
        mfa_code_submitted:
          description: Number of mfa_code_submitted events
          type: integer
        page_opened:
          description: Number of page_opened events
          type: integer
        phishing_remedial_course_completed:
          description: Number of phishing_remedial_course_completed events
          type: integer
        phone_number_called:
          description: Number of phone_number_called events
          type: integer
        phone_number_code_entered:
          description: Number of phone_number_code_entered events
          type: integer
        qr_code_scanned:
          description: Number of qr_code_scanned events
          type: integer
        remedial_completed:
          description: Number of remedial_completed events
          type: integer
        remedial_started:
          description: Number of remedial_started events
          type: integer
        scope_granted:
          description: Number of scope_granted events
          type: integer
        sms_answered:
          description: Number of sms_answered events
          type: integer
        social_login_clicked:
          description: Number of social_login_clicked events
          type: integer
      required:
      - mfa_code_submitted
      - scope_granted
      - social_login_clicked
      - phishing_remedial_course_completed
      - remedial_started
      - remedial_completed
      - qr_code_scanned
      - phone_number_code_entered
      - phone_number_called
      - page_opened
      - manually_retried
      - manually_reported
      - file_opened
      - employee_tricked
      - email_reported
      - email_opened
      - sms_answered
      - email_answered
      - download_link_clicked
      - credentials_submitted
      - attack_voided
      - attack_sent
      - attachment_opened
      title: EmployeeEventsSchema
      type: object
    EmployeeCyberPostureGrade:
      enum:
      - a
      - b
      - c
      - d
      title: EmployeeCyberPostureGrade
      type: string
    UnauthorizedErrorResponse:
      additionalProperties: false
      properties:
        errors:
          items:
            additionalProperties: false
            properties:
              code:
                const: unauthorized
              detail:
                type: string
              source:
                properties:
                  pointer:
                    type: string
                required:
                - pointer
                type: object
              title:
                const: Unauthorized
            required:
            - title
            - source
            - detail
            type: object
          type: array
      required:
      - errors
      title: UnauthorizedErrorResponse
      type: object
    EmployeeStatusSchema:
      description: "        - `active`: default status.\n        - `deactivated`: employee has been manually deactivated.\n\
        \        - `pending`: employee is currently being synced via workspace's AD\n"
      enum:
      - active
      - deactivated
      - pending
      - unlicensed
      title: EmployeeStatusSchema
      type: string
    CourseTheme:
      description: The theme of the course
      enum:
      - digital_footprint
      - gdpr
      - general
      - irl
      - it
      - legal
      - passwords
      - social_engineering
      - technical
      examples:
      - passwords
      title: CourseTheme
      type: string
    ExplanationSource:
      description: Signal source identifier.
      enum:
      - bec
      - bucket_classification
      - low_confidence
      - skip_reason
      - static_tag
      examples:
      - static_tag
      title: ExplanationSource
      type: string
    ReportSource:
      description: How the email was reported.
      enum:
      - access_list
      - alert
      - direct
      - forwarded
      - gmail
      - native_outlook
      - outlook
      - public_api
      - sender_impersonation
      - slash_flagged
      examples:
      - outlook
      title: ReportSource
      type: string
    CampaignCycleOverviewSchema:
      additionalProperties: false
      properties:
        id:
          format: uuid
          type: string
      required:
      - id
      title: CampaignCycleOverviewSchema
      type: object
    ParrotWeb.PublicApi.Scim.Schemas.PatchSchema:
      properties:
        Operations:
          items:
            properties:
              op:
                description: The operation to perform
                enum:
                - add
                - replace
                - remove
                type: string
              path:
                description: Optional path to the attribute (required for remove)
                type: string
              value:
                description: The value to add or replace (required for add and replace)
            required:
            - op
            type: object
          minItems: 1
          type: array
        schemas:
          description: Must be ["urn:ietf:params:scim:api:messages:2.0:PatchOp"]
          items:
            type: string
          type: array
      required:
      - schemas
      - Operations
      type: object
    PaginatedEmployeeWithImpersonationPayload:
      additionalProperties: false
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeOverviewSchema'
        impersonation_stats:
          $ref: '#/components/schemas/ImpersonationStatsSchema'
      required:
      - impersonation_stats
      - employee
      title: PaginatedEmployeeWithImpersonationPayload
      type: object
    CampaignCycleSchema:
      additionalProperties: false
      properties:
        created_at:
          format: date-time
          type: string
        ends_at:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        name:
          examples:
          - Batch 1
          type: string
        starts_at:
          format: date-time
          type: string
        updated_at:
          format: date-time
          type: string
      required:
      - ends_at
      - starts_at
      - updated_at
      - created_at
      - name
      - id
      title: CampaignCycleSchema
      type: object
    AnalysisStatus:
      description: Final verdict assigned to the email.
      enum:
      - fraudulent
      - safe
