        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: resource_type_id
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                type: object
          description: SCIM resource type
        '404':
          content:
            application/scim+json:
              schema:
                type: object
          description: ResourceType not found
      security:
      - apiKeyAuth:
        - scim:read
      summary: Get a SCIM resource type
      tags:
      - Team platform
      x-riot-team-ownership: platform
  /scim/{workspace_id}/v2/Schemas:
    get:
      description: 'Retrieves the list of supported SCIM schemas.


        **Scopes required:**

        - scim:read'
      operationId: schemas_list_schemas_DEOEZDI
      parameters:
      - in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                type: object
          description: SCIM schemas list
      security:
      - apiKeyAuth:
        - scim:read
      summary: List SCIM schemas
      tags:
      - Team platform
      x-riot-team-ownership: platform
  /scim/{workspace_id}/v2/Schemas/{schema}:
    get:
      description: 'Retrieves a specific SCIM schema by ID.


        **Scopes required:**

        - scim:read'
      operationId: schemas_get_schema_DEOEZDI
      parameters:
      - in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - in: path
        name: schema
        required: true
        schema:
          type: string
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                type: object
          description: SCIM schema
        '404':
          content:
            application/scim+json:
              schema:
                type: object
          description: Schema not found
      security:
      - apiKeyAuth:
        - scim:read
      summary: Get a SCIM schema
      tags:
      - Team platform
      x-riot-team-ownership: platform
  /scim/{workspace_id}/v2/ServiceProviderConfiguration:
    get:
      description: 'Retrieves the SCIM service provider configuration, including supported features and capabilities.


        **Scopes required:**

        - scim:read'
      operationId: service_provider_configuration_get_service_provider_configuration_M4XZ6RY
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                type: object
          description: SCIM service provider configuration
      security:
      - apiKeyAuth:
        - scim:read
      summary: Get SCIM service provider configuration
      tags:
      - Team platform
      x-riot-team-ownership: platform
  /scim/{workspace_id}/v2/Users:
    get:
      description: 'Lists users with SCIM pagination support. Supports startIndex, count, and filter parameters.


        **Scopes required:**

        - scim:read'
      operationId: users_list_users_3IQ5M4I
      parameters:
      - in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      - in: query
        name: startIndex
        required: false
        schema:
          default: 1
          minimum: 1
          type: integer
      - in: query
        name: count
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          type: integer
      - in: query
        name: filter
        required: false
        schema:
          type: string
      responses:
        '200':
          content:
            application/scim+json:
              schema:
                type: object
          description: SCIM users list
      security:
      - apiKeyAuth:
        - scim:read
      summary: List SCIM users
      tags:
      - Team platform
      x-riot-team-ownership: platform
    post:
      description: 'Creates a new user from SCIM data.


        **Scopes required:**

        - scim:write'
      operationId: users_create_user_3IQ5M4I
      parameters:
      - in: path
        name: workspace_id
        required: true
        schema:
          format: uuid
          type: string
      requestBody:
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ParrotWeb.PublicApi.Scim.Schemas.UserSchema'
        required: true
      responses:
        '201':
          content:
            application/scim+json:
              schema:
                type: object
          description: SCIM user created
        '400':
          content:
            application/scim+json:
              schema:
                type: object
          description: Invalid request
        '409':
          content:
            application/scim+json:
              schema:
                type: object
          description: Username already exists
      security:
      - apiKeyAuth:
        - scim:write
      summary: Create a SCIM user
      tags:
      - Team platform
      x-riot-team-ownership: platform
