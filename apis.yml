apis:
- name: Riot Public API
  description: >-
    Public REST API for the Riot employee security posture management platform. Read access to organization and
    workspace metadata, employees and groups, awareness courses and per-employee learning progress, phishing
    simulation campaigns and their attacks/events, credential breaches and compromised employees, and Inbox/Slash
    email-report statistics. Includes a SCIM 2.0 provisioning surface for users and groups, and Standard Webhooks
    server-to-server events (OCSF Detection Finding payloads). Authenticated with an x-api-key header; keys are
    scoped to an organization or a single workspace and can be further limited to read scopes.
  humanURL: https://docs.tryriot.com/
  baseURL: https://public-api.tryriot.com/v1
