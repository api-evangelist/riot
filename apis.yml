aid: riot
name: Riot
description: >-
  Riot is a Paris-based employee security posture management (human risk management) platform that helps companies
  reduce the human attack surface. The product suite spans phishing and smishing simulation, security awareness
  training courses, credential breach monitoring, employee-reported email triage (Inbox), inbound email protection
  (Slash), and third-party SaaS/drive exposure monitoring (Sonar), fronted by a chat assistant that runs in Slack,
  Microsoft Teams and the web portal. Riot publishes a public REST API (OpenAPI 3.1.1, x-api-key authentication,
  cursor pagination, scoped keys) that exposes organization, employee, group, course, campaign, attack, breach and
  inbox data, a SCIM 2.0 provisioning surface for user and group lifecycle, and Standard-Webhooks server-to-server
  events whose payloads follow the OCSF Detection Finding schema so they can be ingested by a SIEM or SOAR without
  custom mapping.
