x-note: >-
  Captures API Evangelist's derived annotations over Riot's published OpenAPI 3.1.1. The harvested spec in
  openapi/_original/ is never mutated. Nothing here changes Riot's contract — these are our findings,
  expressed as x- extensions so they travel with the spec.
actions:
