note: >-
  Riot does NOT use OAuth 2.0. This artifact records the API-key scope model the provider documents in the
  OpenAPI `info.description` under "Authorization". Scopes are attached to an `x-api-key` credential, not
  granted through an authorization flow, so there are no authorization/token endpoints and no consent step.
  The `components.securitySchemes.apiKeyAuth` object declares no scopes, and no operation declares a
  `security[]` scope requirement — the scope names below come from the prose reference only, which is why
  the scope-to-operation binding is recorded as not-published.
key_scoping:
  levels:
  - level: organization
    description: >-
      Organization-scoped keys can access any workspace belonging to the organization. Endpoints that take a
      `workspace_id` parameter accept any workspace of that organization.
  - level: workspace
    description: >-
      Workspace-scoped keys are restricted to a single workspace. Requests targeting a different workspace
      through a `workspace_id` parameter are rejected with a 403 status code.
  enforcement_status: 403
