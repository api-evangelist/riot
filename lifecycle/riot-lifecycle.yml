compatibility_policy:
  scope: webhook events only
  published: true
  source: https://public-api.tryriot.com/openapi
  forward_compatibility_rule: >-
    Consumers must ignore unknown fields in the `data` object — new fields may be added at any time without
    notice and without a version bump.
  non_breaking:
  - adding a new field to the payload
  - adding a new event type
  breaking:
  - removing or renaming a field
  - changing the type of a field
  - changing the meaning of an existing value (e.g. repurposing an enum value)
  breaking_change_mechanism: >-
    Breaking changes ship under a NEW event type (e.g. inbox_email_analysis.classified.v2); the original
    event type is left unchanged. This is an additive-only, never-mutate contract for events, and it is the
    closest thing Riot publishes to a deprecation policy — but nothing states how long the superseded event
    type is retained.
  note: >-
    No equivalent compatibility statement exists for the REST endpoints.
